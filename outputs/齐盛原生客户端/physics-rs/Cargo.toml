[package]
name = "qs-native-physics"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["godot-bridge"]
godot-bridge = ["dep:godot"]

[dependencies]
rapier3d = { version = "=0.30.1" }
parry3d = { version = "=0.25.3" }
nalgebra = { version = "=0.34.1" }
godot = { version = "=0.5.5", default-features = false, features = ["api-4-7"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "trace-parity"
path = "src/bin/trace_parity.rs"
