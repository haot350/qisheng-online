; Merge into export_presets.cfg after the Windows preset. This is an internal
; arm64 Android 10+ build, not a production signing configuration.
[preset.1]
name="Android Internal arm64"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="native-internal"
export_filter="all_resources"
include_filter="*.json,*.bin,*.txt"
exclude_filter="work/*,private/*,assets-source/*,docs/*,tests/*,scripts/*,*.md,export_presets.android.fragment.cfg"
export_path="dist/qisheng-online-native-m1-arm64-internal.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]
custom_template/debug="work/templates/android_debug.apk"
custom_template/release="work/templates/android_release.apk"
gradle_build/use_gradle_build=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="native-m1-internal"
package/unique_name="org.openqs.qisheng.nativepreview"
package/name="齐盛Online · 原生技术预览"
package/signed=true
screen/immersive_mode=true
screen/edge_to_edge=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
permissions/internet=true

